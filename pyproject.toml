[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobapp"
version = "0.1.1"
description = "Job-search assistant: find jobs, filter, score against your resume, build tailored PDFs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.5",
  "pyyaml>=6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "mcp>=1.2",
  "python-docx>=1.1",
  "pypdf>=4",
  "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
jobapp = "jobapp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobapp"]

[tool.hatch.build.targets.wheel.force-include]
"examples/profile" = "jobapp/_examples/profile"
"prompts" = "jobapp/_prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real network tests (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
