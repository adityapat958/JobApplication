# Skills vocabulary: the only terms that can appear in a job's "missing" list.
# A term is "missing" when the job ad mentions it (or one of its aliases) and your keyword bank doesn't
# have it. Add your own terms in keywords.yaml under `extra_vocab:` (same format as below).
#
# Format: group -> {Canonical Term: [aliases…]}. Aliases include Norwegian equivalents.
# A term or alias starting with "=" is matched case-sensitively (for words that are also ordinary English,
# e.g. "=Spark" won't match "spark curiosity"). Short all-caps terms (≤3 letters) are case-sensitive anyway.

