<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>JobApplication</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 :root{--bg:#0f1115;--panel:#161a22;--line:#20252f;--text:#dfe3ea;--dim:#9aa;--acc:#8bd;--ok:#4a9}
 body{font:14px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text)}
 header{padding:10px 16px;background:var(--panel);border-bottom:1px solid #262b36;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:3}
 h1{font-size:16px;margin:0;color:var(--acc)}
 input,select{background:var(--bg);color:var(--text);border:1px solid #333b48;border-radius:6px;padding:5px 8px;font:inherit}
 table{border-collapse:collapse;width:100%}
 th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
 th{cursor:pointer;user-select:none;background:#12151c;position:sticky;top:49px;z-index:2}
 th:hover{color:var(--acc)} tr:hover td{background:#151a22}
 .kw{color:var(--dim);font-size:12px}
 .bar{height:6px;background:#222;border-radius:3px;width:54px;display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
 .bar>i{display:block;height:100%;background:var(--ok)}
 a{color:#7bd}
 button{background:#243;color:#9fd;border:1px solid #365;border-radius:6px;padding:4px 8px;cursor:pointer;font:inherit}
 button:hover{background:#365} button:disabled{opacity:.5;cursor:wait}
 .man{color:#c85;font-size:11px}
 .why{color:#c85;font-size:12px}
 tr.hid td{opacity:.6}
 tr.done td.t{text-decoration:line-through;opacity:.6}
 label{color:var(--dim);font-size:12px}
 #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#243;color:#cfe;padding:10px 16px;border:1px solid #47a;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;max-width:80vw;z-index:9}
 #toast.on{opacity:1;pointer-events:auto}
 #toast button{margin-left:10px}
 .empty{padding:40px;text-align:center;color:var(--dim)}
 select.st{padding:2px 4px;font-size:12px}
</style></head><body>
<header>
 <h1>JobApplication</h1>
 <input id="q" placeholder="search company / title / place" size="26">
 <label>show <select id="show">
   <option value="todo">to do</option><option value="tracking">interested + applied…</option>
   <option value="all">all</option><option value="hidden">hidden by my filters</option></select></label>
 <label>site <select id="src"><option value="">all sites</option></select></label>
 <label>type <select id="type"><option value="">any</option><option value="fulltime">full-time</option>
   <option value="internship">internship</option><option value="parttime">part-time</option></select></label>
 <label>posted <select id="age"><option value="0">any time</option><option value="1">last 24h</option>
   <option value="3">last 3 days</option><option value="7">last week</option><option value="30">last 30 days</option></select></label>
 <label>sort <select id="sort"><option value="match">best match</option><option value="newest">newest first</option>
   <option value="newmatch">newest, then match</option><option value="company">company A–Z</option></select></label>
 <label>min match <b id="mv">0</b>% <input id="mm" type="range" min="0" max="100" value="0"></label>
 <span id="count" class="kw"></span>
 <span style="margin-left:auto" class="kw" id="fresh"></span>
 <button id="refresh" onclick="refresh()">↻ Find new jobs</button>
</header>
<table><thead><tr>
 <th data-k="company">Company</th><th data-k="title">Title</th><th data-k="location">Location</th>
 <th data-k="source">Site</th><th data-k="posted">Posted</th><th data-k="match_pct">Match</th>
 <th>Status</th><th>Actions</th>
</tr></thead><tbody id="b"></tbody></table>
<div id="none" class="empty" style="display:none">No jobs to show. Try “all”, lower the match slider, or press “Find new jobs”.</div>
<div id="toast"></div>
<script>
const H={'X-JobApp':'1','Content-Type':'application/json'};
const STATUSES=['new','interested','applied','interview','rejected','offer','ignored'];
const FOLDER='{{FOLDER_LABEL}}';
let JOBS=[], SORTS=null; const DAY=86400000;
const PRESETS={newest:[['posted',-1],['match_pct',-1]],match:[['match_pct',-1],['title_score',-1],['posted',-1]],
  newmatch:[['day',-1],['match_pct',-1]],company:[['company',1],['posted',-1]]};
function posted(j){return j.posted_at||j.first_seen_at||''}
function ageDays(j){const t=Date.parse(posted(j));return isNaN(t)?9999:Math.floor((Date.now()-t)/DAY)}
function ageLabel(j){const d=ageDays(j);if(d>=9999)return '—';
  const c=d<=1?'#4c8':d<=7?'#9c6':d<=30?'#ca6':'#777';
  return `<span style="color:${c}">${d<=0?'today':d+'d ago'}</span>`}
function val(j,k){if(k==='posted')return posted(j);if(k==='day')return posted(j).slice(0,10);
  if(k==='match_pct')return j.match_pct==null?-1:j.match_pct;
  if(k==='title_score')return j.title_score||0;return (j[k]||'').toString().toLowerCase()}
function cmp(a,b){for(const [k,d] of SORTS){const x=val(a,k),y=val(b,k);if(x<y)return -d;if(x>y)return d}return 0}
const SAVE=['q','show','src','type','age','sort','mm'];
function saveUI(){const o={};SAVE.forEach(i=>o[i]=document.getElementById(i).value);localStorage.setItem('jobapp-ui',JSON.stringify(o))}
function restoreUI(){try{const o=JSON.parse(localStorage.getItem('jobapp-ui')||'{}');
  SAVE.forEach(i=>{if(o[i]!==undefined)document.getElementById(i).value=o[i]})}catch(e){}
  SORTS=PRESETS[document.getElementById('sort').value]||PRESETS.match}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(html,ms=5000){const t=document.getElementById('toast');t.innerHTML=html;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)}
async function api(url,opts={}){const r=await fetch(url,{headers:H,...opts});let d={};try{d=await r.json()}catch(e){}
  if(!r.ok&&d.ok===undefined)d.ok=false;return d}
async function load(){JOBS=await (await fetch('/api/jobs')).json();
  const srcs=[...new Set(JOBS.map(j=>j.source))].sort(),s=document.getElementById('src');
  s.querySelectorAll('option:not([value=""])').forEach(o=>o.remove());
  srcs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o)});
  restoreUI();render();freshness()}
function render(){
  const q=document.getElementById('q').value.toLowerCase(),show=document.getElementById('show').value,
    src=document.getElementById('src').value,ty=document.getElementById('type').value,
    age=+document.getElementById('age').value,mm=+document.getElementById('mm').value;
  document.getElementById('mv').textContent=mm;
  let rows=JOBS.filter(j=>{
    if(show==='hidden'){if(!j.hidden)return false}
    else{if(j.hidden)return false;
      if(show==='todo'&&!['new','interested'].includes(j.status))return false;
      if(show==='tracking'&&j.status==='new')return false}
    const hay=(j.company+' '+j.title+' '+j.location).toLowerCase();
    return hay.includes(q)&&(!src||j.source===src)&&(!ty||j.job_type===ty)&&(!age||ageDays(j)<=age)
      &&(mm===0||(j.match_pct||0)>=mm)});
  rows.sort(cmp);saveUI();
  document.getElementById('count').textContent=`${rows.length} shown · ${JOBS.filter(j=>!j.hidden).length} total · ${JOBS.filter(j=>j.hidden).length} hidden`;
  document.getElementById('none').style.display=rows.length?'none':'block';
  const b=document.getElementById('b');b.innerHTML='';
  for(const j of rows){
    const kw=(j.matched||[]).slice(0,5).join(', ');
    const m=j.match_pct==null?'<span class="man" title="No job description saved — paste it via JD 📝">no JD</span>'
      :`<span class="bar"><i style="width:${Math.min(100,j.match_pct)}%"></i></span>${Math.round(j.match_pct)}%`;
    const opts=STATUSES.map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('');
    const tr=document.createElement('tr');tr.dataset.id=j.id;
    if(j.hidden)tr.className='hid';else if(j.done)tr.className='done';
    tr.innerHTML=`<td class="t">${esc(j.company)}</td>
      <td class="t">${esc(j.title)}${j.hidden?`<div class="why">hidden: ${esc(j.hidden_reason)}</div>`:''}<div class="kw">${esc(kw)}</div></td>
      <td>${esc(j.location)}</td><td class="kw">${esc(j.source)}${(j.also_on||[]).length?`<br><span title="same job on another site">also on: ${(j.also_on||[]).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join(', ')}</span>`:''}</td>
      <td style="white-space:nowrap" title="${esc(posted(j))}">${ageLabel(j)}</td>
      <td style="white-space:nowrap">${m}</td>
      <td><select class="st" onchange="setStatus('${j.id}',this)">${opts}</select></td>
      <td style="white-space:nowrap"><a href="${esc(j.apply_url||j.url)}" target="_blank" rel="noopener">Open ad ↗</a>
        &nbsp;<a href="/job/${j.id}">JD 📝</a>${j.jd_saved_at?' <span style="color:#4a9" title="you saved this JD">✓</span>':''}
        &nbsp;<button onclick="build('${j.id}',this)">Build resume</button></td>`;
    b.appendChild(tr)}}
async function setStatus(id,sel){const d=await api('/api/jobs/'+id+'/status',{method:'POST',body:JSON.stringify({status:sel.value})});
  if(!d.ok){toast('Could not save: '+esc(d.error));return}
  const j=JOBS.find(x=>x.id===id);j.status=d.status;j.done=d.done;if(d.status!=='new')j.hidden=0;
  toast(`${esc(j.company)}: <b>${esc(d.status)}</b>`,2500);render()}
async function build(id,btn){btn.disabled=true;toast('Building your resume… (takes a few seconds)',60000);
  try{const d=await api('/api/build/'+id,{method:'POST'});
    if(!d.ok){toast('Build failed: '+esc(d.error),10000);return}
    const a=document.createElement('a');a.href=d.pdf_url;a.download=d.filename;document.body.appendChild(a);a.click();a.remove();
    const warn=(d.warnings||[]).map(w=>'<br>⚠ '+esc(w)).join('');
    toast(`Downloaded <b>${esc(d.filename)}</b> — ${d.matched.length} keywords matched.${warn}
      <button onclick="reveal('${id}')">${FOLDER}</button>`,12000)}
  catch(e){toast('Error: '+esc(e))}finally{btn.disabled=false}}
async function reveal(id){await api('/api/reveal/'+id,{method:'POST'})}
async function refresh(){await api('/api/refresh',{method:'POST'});toast('Searching job sites… this can take a few minutes.');freshness()}
async function freshness(){try{const d=await (await fetch('/api/refresh')).json();
  const el=document.getElementById('fresh'),btn=document.getElementById('refresh');
  el.textContent=d.running?'searching job sites…':(d.last?('last search '+d.last+(d.summary?' — '+d.summary:'')):'');
  if(d.error&&!d.running)el.textContent+=' (problem: '+d.error.slice(0,80)+')';
  btn.disabled=!!d.running;
  if(d.running){window._was=true;setTimeout(freshness,4000)}
  else if(window._was){window._was=false;toast('Done — list updated.');load()}}catch(e){}}
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k==='posted'?'posted':th.dataset.k;
  const cur=SORTS[0];const d=(cur[0]===k)?-cur[1]:((k==='match_pct'||k==='posted')?-1:1);SORTS=[[k,d],['match_pct',-1]];render()});
document.getElementById('sort').addEventListener('input',e=>{SORTS=PRESETS[e.target.value];render()});
['q','show','src','type','age','mm'].forEach(id=>document.getElementById(id).addEventListener('input',render));
function stick(){const h=document.querySelector('header').offsetHeight;document.querySelectorAll('th').forEach(t=>t.style.top=h+'px')}
window.addEventListener('resize',stick);stick();
load();
</script></body></html>
