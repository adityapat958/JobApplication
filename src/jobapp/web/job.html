<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Job — JobApplication</title>
<style>
 body{font:14px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;background:#0f1115;color:#dfe3ea;padding:20px;max-width:1000px}
 a{color:#7bd} h1{font-size:18px;color:#8bd;margin:0 0 4px}
 .meta{color:#9aa;font-size:12px;margin-bottom:14px}
 textarea{width:100%;height:340px;background:#0b0d11;color:#dfe3ea;border:1px solid #333b48;border-radius:8px;padding:10px;font:13px/1.4 ui-monospace,monospace;box-sizing:border-box}
 button{background:#243;color:#9fd;border:1px solid #365;border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:10px}
 select{background:#0b0d11;color:#dfe3ea;border:1px solid #333b48;border-radius:6px;padding:5px}
 .kw{color:#9aa;font-size:13px} #res{margin-top:12px;color:#4a9}
</style></head><body>
<p><a href="/">&larr; back to all jobs</a></p>
<h1 id="h">…</h1><div class="meta" id="meta"></div>
<p class="kw" id="match"></p>
<p>Job description (paste the full text from the ad if it's empty or wrong, then Save — this improves the match and the tailored resume):</p>
<textarea id="jd"></textarea><br>
<button onclick="save()">Save description</button> <button onclick="build()">Build resume</button> <button onclick="letter()">Cover letter ✉</button>
<div id="letter" style="display:none;margin-top:12px;padding:10px;border:1px solid #333b48;border-radius:8px"></div>
<p>Notes:</p><textarea id="notes" style="height:90px"></textarea><br><button onclick="saveNotes()">Save notes</button>
<div id="res"></div>
<script>
const ID='{{JOB_ID}}',H={'X-JobApp':'1','Content-Type':'application/json'};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(j){document.getElementById('match').innerHTML=j.match_pct==null?'No match score yet (no description).':
  `Match ${Math.round(j.match_pct)}% · matched: ${esc((j.matched||[]).join(', ')||'–')}<br>In the ad but not in your keywords: ${esc((j.missing||[]).slice(0,15).join(', ')||'–')}`}
async function load(){const j=await (await fetch('/api/jobs/'+ID)).json();
  document.getElementById('h').textContent=j.company+' — '+j.title;
  document.getElementById('meta').innerHTML=`${esc(j.location)} · ${esc(j.source)}${(j.also_on||[]).map(a=>` (also on <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>)`).join('')} · status ${esc(j.status)}${j.variant?` · resume ${esc(j.variant)}${j.variant_chosen?'':' (auto)'}`:''} · <a href="${esc(j.apply_url||j.url)}" target="_blank" rel="noopener">open ad ↗</a>`;
  document.getElementById('jd').value=j.description||'';document.getElementById('notes').value=j.notes||'';show(j)}
async function save(){const r=await fetch('/api/jobs/'+ID+'/description',{method:'POST',headers:H,body:JSON.stringify({description:document.getElementById('jd').value})});
  const d=await r.json();document.getElementById('res').textContent=d.ok?'Saved.':'Error: '+d.error;if(d.ok)show(d)}
async function saveNotes(){const r=await fetch('/api/jobs/'+ID+'/notes',{method:'POST',headers:H,body:JSON.stringify({notes:document.getElementById('notes').value})});
  document.getElementById('res').textContent=(await r.json()).ok?'Notes saved.':'Error'}
async function build(){document.getElementById('res').textContent='Building…';
  const d=await (await fetch('/api/build/'+ID,{method:'POST',headers:H})).json();
  if(!d.ok){document.getElementById('res').textContent='Build failed: '+d.error;return}
  const a=document.createElement('a');a.href=d.pdf_url;a.download=d.filename;document.body.appendChild(a);a.click();a.remove();
  document.getElementById('res').innerHTML='Downloaded '+esc(d.filename)+((d.warnings||[]).map(w=>'<br>⚠ '+esc(w)).join(''))}
async function letter(){const box=document.getElementById('letter');box.style.display='block';box.textContent='Checking…';
  const d=await (await fetch('/api/letter/'+ID)).json();
  if(!d.ok){box.textContent='Error: '+d.error;return}
  let h='';
  for(const [lang,r] of Object.entries(d.letters||{})){
    h+=`<p><b>✔ Ready (${esc(lang)})</b> · <a href="${esc(r.pdf_url)}" download="${esc(r.filename)}">download PDF</a> · <button onclick="copyText('lt-${esc(lang)}')">Copy text</button></p>`+
       `<textarea id="lt-${esc(lang)}" style="height:160px" readonly>${esc(r.text)}</textarea>`}
  const st={needs_claude:'Needs Claude — prompt is ready',failing:`Needs Claude — round ${d.round} of 3 failed the checks`,passed:'Passed the checks — Claude can accept it'}[d.draft];
  if(st)h+=`<p>Draft (${esc(d.language)}): ${esc(st)}.</p>`;
  if(d.state!=='ready'||d.draft)h+=`<p>Ask Claude: <code>/cover-letter ${esc(ID)}</code> (Claude writes it, the app checks every fact against your resume and the ad).</p>`;
  h+=`<p>Start a new draft: <select id="lt-lang"><option value="">default language</option><option value="en">English</option><option value="no">Norwegian</option></select> <button onclick="prepLetter()">Prepare for Claude</button></p>`;
  box.innerHTML=h}
async function prepLetter(){const lang=document.getElementById('lt-lang').value;
  const d=await (await fetch('/api/letter/'+ID+'/prepare',{method:'POST',headers:H,body:JSON.stringify({language:lang})})).json();
  if(!d.ok){document.getElementById('letter').textContent='Error: '+d.error;return}
  await letter();document.getElementById('letter').insertAdjacentHTML('afterbegin',`<p>Prompt ready. In Claude, type: <code>${esc(d.ask_claude)}</code></p>`)}
function copyText(id){const t=document.getElementById(id);t.select();navigator.clipboard?navigator.clipboard.writeText(t.value):document.execCommand('copy')}
load();
</script></body></html>
