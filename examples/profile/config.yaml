# JobApplication settings. Edit freely — then run:  jobapp config validate
profile:
  name: Alex Example
  locale: en            # en | no

sources:
  simplify:
    enabled: false
    lists: [summer_internships, new_grad, offseason]
  linkedin:
    enabled: true
    searches:
      - {keywords: "business analyst", location: "Oslo, Norway"}
    max_pages: 3
  finn:
    enabled: false
    searches:
      - {q: "analytiker", location: "Oslo"}
  bi_portal:
    enabled: false      # needs a student login — planned for a later version

filters:
  title_include: [analyst, consultant]      # keep a job if its title has ANY of these words
  title_exclude: [senior, lead, principal]  # hide a job if its title has ANY of these
  locations: [Oslo, Remote]                 # empty list = anywhere
  job_types: [fulltime, internship, parttime]
  max_age_days: 21
  companies_include: []                     # empty list = all companies
  companies_exclude: []
  languages: []                             # e.g. [en, no] to keep only English/Norwegian ads

resume:
  tex: resume/resume.tex
  keywords: resume/keywords.yaml
  output_name: "{first}_{last}_{company}_{role}"

schedule:
  times: ["09:00", "18:00"]

connectors:
  obsidian:                       # one note per job in your Obsidian vault (off until you turn it on)
    enabled: false
    vault: ~/Documents/Obsidian Vault
    folder: Jobs                  # inside the vault
    subfolders: {fulltime: Full-Time, internship: Internships, parttime: Part-Time}
    only_visible: true            # skip jobs your filters hid and duplicates from other sites
    min_match: 0                  # only jobs with at least this match %
    dashboard_note: true          # _Dashboard.md + _New Today.md
    two_way: false                # true = status changes you make in a note come back here
    git_push: false               # commit (and push) the Jobs folder after each search, if the vault uses git
  jsonl: {enabled: false}
