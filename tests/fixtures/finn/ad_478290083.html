<html><head><script type="application/ld+json">{"script:ld+json":{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","item":{"@id":"http://www.finn.no","name":"FINN"},"position":1},{"@type":"ListItem","item":{"@id":"http://www.finn.no/job/browse.html","name":"Jobb"},"position":2},{"@type":"ListItem","item":{"@id":"http://www.finn.no/job/search","name":"Søk"},"position":3},{"@type":"ListItem","item":{"@id":"http://www.finn.no/job/search?location=1.20001.20061","name":"Oslo"},"position":4},{"@type":"ListItem","item":{"@id":"http://www.finn.no/job/search?location=2.20001.20061.20533","name":"Ullern"},"position":5}]}}</script><script type="application/ld+json">{"script:ld+json":{"@context":"https://schema.org","@type":"JobPosting","datePosted":"2026-10-09","description":"<p></p><p>Vi i Produkt og Pris skaper, utvikler og prissetter produktene If tilbyr mot privatmarkedet. If er det største forsikringsselskapet i Norden og motorporteføljen i Norge er en av de største porteføljene i selskapet. Vi er ansvarlig for Ifs bil-, mc- og båtforsikrings produkter, men også andre konsepter som er relevante for våre kunder når det kommer til bilhold og mobilitet.</p><p> </p><p>Vi opererer i et marked med tøff konkurranse. Både kjøretøyene, menneskene bak rattet, og markedet vi opererer i endres hele tiden. Teknologi og data fra bilene skaper nye muligheter. Kundene krever stadig mer når det kommer til enkelhet, fleksibilitet, pris og miljø. Vi kniver mot konkurrentene våre hver dag og må hele tiden forbedre oss. Samtidig må vi følge med på trender og sikre at vi har de beste løsningene for våre kunder i fremtiden.</p><p> </p><p><strong>Om rollen</strong></p><p>Vi ser nå etter en analytiker med ansvar for resultatoppfølging og prognose. Dette innebærer å rapportere og analysere porteføljeutviklingen og enkeltprodukter med fokus på lønnsomhet og konkurransekraft. Du er også ansvarlig for prognose og finansielle planprosesser. Den som har dette ansvaret kjenner dataene og markedet godt og kan gjennom dette gi tidlige indikasjoner på avvik. Vi ser etter deg som ønsker å ta en proaktiv rolle i å omforme analyser til innsikt og handling. Du vil samarbeide tett med andre analytikere, ledergruppen, produktutviklere og produktsjefer og du vil ha en sentral rolle i strategiske beslutninger og prosjekter.</p><p> </p><p><strong>Hvem er du?</strong></p><p>Vi tror på å ansette talenter som har et stort ønske om å utvikle seg selv og andre, og dette er noe vi vil støtte uavhengig av din bakgrunn. Du har sterk forretningsforståelse og interesse for å forstå dynamikken i markedet vi opererer i. Du er nysgjerrig og liker å behandle og identifisere nye datakilder for å forstå sammenhenger. Du evner å omforme store datamengder i pedagogiske visualiseringer som gir et presist bilde av virkeligheten. I tillegg trives du av å jobbe i team, og er flink til å kommunisere komplekse analyser på en forståelig måte. </p><p> </p><p><strong>Du har også:</strong></p><ul><li><p>Masterutdanning innen økonomi, finans, matematikk, statistikk, fysikk e.l. med gode akademiske resultater</p></li><li><p>Har erfaring som analytiker, konsulent, data scientist eller utvikler innen datavarehus</p></li><li><p>Har programmeringsferdigheter i SQL, R, Python eller lignende</p></li><li><p>Erfaring med fra forsikring, finans eller bransjer som driver med abonnementstjenester er en fordel </p></li><li><p>Erfaring med porteføljestyring eller resultatrapportering er en fordel</p></li><li><p>Du bruker aktivt AI-verktøy i analyse- og innsiktsarbeid, og er nysgjerrig på hvordan AI kan bidra til dypere innsikt, smartere arbeidsprosesser og økt effektivitet</p></li></ul><p><strong> </strong></p><p><strong>Om teamet</strong></p><p><em>Produkt Motor teamet vil være dine nærmeste medarbeidere og støttespillere. Vi er en gjeng meget kompetente og motiverte analytikere, produkteksperter og produktutviklere. Vi jobber aktivt med data, markeds- og kundeinnsikt for å sikre at vi lager løsninger på våre kunders problemer</em></p><p><br /></p><p>I tillegg til å være en del av Produkt Motor, vil du inngå i analytikergruppen til Produkt Norge. Dette er et markedsledende fagmiljø hvor du vil få faglig oppfølging av Fagleder for Analyse. I tillegg vil du finne støtte til bruk av analyseverktøy, datavarehus og metodikk.</p><p><br /></p><p><strong>Tilleggsinformasjon og rekrutteringsprosessen</strong><br /><strong>Søknadsfrist</strong>: 20. oktober 2026<br /><strong>For å søke:</strong> Last opp din CV og svar på et par spørsmål i vår søknadsportal, i stedet for å skrive søknadsbrev.<br /><strong>Arbeidssted</strong>: Vækerø, Oslo.<br /><strong>Oppstart</strong>: Etter avtale.<br /><strong>Kontakt</strong>: Vil du vite mer om stillingen? Ta kontakt med Mari Støbakk, leder for Produkt Motor, på epost mari.stobakk&#64;if.no.</p><p><em><br /></em></p><p><em>Det er en forutsetning for ansettelse at kandidaten oppfyller kravene til egnethet og skikkethet (fit and proper), inkludert bestått utvidet bakgrunnssjekk.</em></p><p><br /></p>","employmentType":["FULL_TIME"],"hiringOrganization":{"@type":"Organization","name":"If Forsikring (If Skadeforsikring)","url":"https://www.if.no/om-if/jobbe-i-if"},"identifier":"478290083","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"NO","addressLocality":"Oslo","postalCode":"0283","streetAddress":"Drammensveien 264"}},"title":"Analytiker med ansvar for resultatoppfølging og prognose","url":"http://www.finn.no/job/ad/478290083","validThrough":"2026-10-20"}}</script></head><body><main><h1>Analytiker med ansvar for resultatoppfølging og prognose</h1></main></body></html>
